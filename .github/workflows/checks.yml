name: checks
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vapor
          POSTGRES_PASSWORD: vapor
          POSTGRES_DB: vapor
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vapor" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      REQUIRE_WEASYPRINT: "1"
      DATABASE_URL: postgresql://vapor:vapor@127.0.0.1:5432/vapor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Retry package downloads on transient mirror errors
        run: printf '%s\n' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: CHANGELOG.md matches changelog.d/
        run: uv run python manage.py changelog --check
      - run: uv run python manage.py migrate --noinput
      - name: Collect static assets for template-serving tests
        run: uv run python manage.py collectstatic --noinput
      - run: uv run pytest

  browser:
    runs-on: ubuntu-latest
    # The form sweep and page sweeps drive every dialog form and page per role (about 25 minutes).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vapor
          POSTGRES_PASSWORD: vapor
          POSTGRES_DB: vapor_browser
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vapor" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      REQUIRE_WEASYPRINT: "1"
      DATABASE_URL: postgresql://vapor:vapor@127.0.0.1:5432/vapor_browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Retry package downloads on transient mirror errors
        run: printf '%s\n' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core poppler-utils
      - run: uv sync --frozen --group e2e
      - name: Install headless Chromium and system dependencies
        run: uv run --group e2e playwright install --with-deps --only-shell chromium
      - name: Collect assets with strict production manifest storage
        run: uv run --group e2e python manage.py collectstatic --noinput
      - name: Isolated browser journeys (one worker, disposable test database)
        run: uv run --group e2e pytest -c e2e/pytest.ini e2e

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vapor_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: vapor_container_smoke
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vapor_ci -d vapor_container_smoke" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application image (no push)
        run: docker build --tag biorepository:ci .
      - name: Validate the local trial Compose file
        run: docker compose --profile app config --quiet
      - name: Configure disposable smoke environment
        run: |
          cat > "$RUNNER_TEMP/vapor-smoke.env" <<'ENV'
          DEBUG=false
          SECRET_KEY=disposable-ci-only-key-never-for-a-real-deployment-2026
          DATABASE_URL=postgresql://vapor_ci:disposable_ci_password@127.0.0.1:5432/vapor_container_smoke
          ALLOWED_HOSTS=127.0.0.1,localhost
          PORT=8000
          WEB_CONCURRENCY=1
          ENV
      - name: Migrate empty smoke database and verify PDF runtime
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/vapor-smoke.env" biorepository:ci python manage.py migrate --noinput
          docker run --rm --network host --env-file "$RUNNER_TEMP/vapor-smoke.env" biorepository:ci python manage.py check
          docker run --rm --env-file "$RUNNER_TEMP/vapor-smoke.env" biorepository:ci python -c 'from weasyprint import HTML; pdf=HTML(string="<h1>Synthetic container smoke</h1>").write_pdf(); assert pdf.startswith(b"%PDF-")'
      - name: Verify non-root Render SSH prerequisites
        run: |
          docker run --rm biorepository:ci python -c 'import os, pwd, stat; from pathlib import Path; user=pwd.getpwuid(os.getuid()); home=Path.home(); ssh=home/".ssh"; assert os.getuid()==10001; assert str(home)==user.pw_dir=="/home/app" and os.access(home, os.W_OK); assert user.pw_shell=="/bin/bash" and os.access(user.pw_shell, os.X_OK); assert ssh.is_dir() and ssh.stat().st_uid==os.getuid(); assert stat.S_IMODE(ssh.stat().st_mode)==0o700; assert os.access(ssh, os.W_OK)'
      - name: Start production server and check HTTP endpoints
        run: |
          docker run --detach --name vapor-smoke --network host --env-file "$RUNNER_TEMP/vapor-smoke.env" biorepository:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ready/; then break; fi
            sleep 2
          done
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ready/
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/about/ --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/about/assets/site.css --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/accounts/login/ --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/static/admin/css/base.css --output /dev/null
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs vapor-smoke || true
          docker rm -f vapor-smoke || true
          rm -f "$RUNNER_TEMP/vapor-smoke.env"
