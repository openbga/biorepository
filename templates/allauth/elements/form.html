{% load allauth ui %}<form class="vr-form" method="{{ attrs.method }}"{% if attrs.action %} action="{{ attrs.action }}"{% endif %} novalidate>
  {% if attrs.form %}{% form_errors form=attrs.form %}{% endif %}
  {% slot body %}{% endslot %}
  <div class="vr-form-actions">{% slot actions %}{% endslot %}</div>
</form>
